name: Create Release

on:
  push:
    branches: [main]

jobs:
  tag-and-release:
    name: Tag and create draft release
    runs-on: ubuntu-latest
    # Only run when the Version Packages PR is merged (changesets commit message)
    if: "contains(github.event.head_commit.message, 'chore: version packages')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./packages/js/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}" \
            -m "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create release branch
        run: |
          git checkout -b "release/v${{ steps.version.outputs.version }}"
          git push origin "release/v${{ steps.version.outputs.version }}"

      - name: Create GitHub draft release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG=$(awk -v ver="$VERSION" \
            '/^## /{if(found) exit; if(index($0,ver)) found=1; next} found{print}' \
            packages/js/CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release v$VERSION"
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$CHANGELOG" \
            --draft
          echo "## Draft release created: v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "Publish when ready:" >> $GITHUB_STEP_SUMMARY
          echo "- Actions → **Publish All Packages** → Run workflow _(publishes JS, React, Kotlin, Swift, Dart in one go)_" >> $GITHUB_STEP_SUMMARY
          echo "  - Or individually: **Publish JS to npm**, **Publish React to npm**, **Publish Kotlin to Maven Central**, **Publish Swift Package**" >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
