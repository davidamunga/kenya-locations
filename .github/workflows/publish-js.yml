name: Publish JS to npm

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/js

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Validate shared data
        run: node ../../scripts/validate-data.js

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test

      - name: Get package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## Published kenya-locations@${{ steps.version.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY
          echo "- [npm](https://www.npmjs.com/package/kenya-locations)" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
