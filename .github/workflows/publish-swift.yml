name: Publish Swift Package

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: Build & Test Swift Package
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        working-directory: packages/swift
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Require Create Release tag
        run: |
          git fetch --tags --force
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Missing $TAG. Merge the Version PR and wait for Create Release to tag the core trio."
            exit 1
          fi
          echo "Found $TAG"

      - name: Validate shared data
        run: node scripts/validate-data.js

      # Swift Package Manager installs straight from the git tag, so the
      # committed Resources must already match data/.
      - name: Fail if bundled Swift data is stale
        run: |
          cp data/*.json packages/swift/Sources/KenyaLocations/Resources/
          git add -N packages/swift/Sources/KenyaLocations/Resources
          git diff --exit-code -- packages/swift/Sources/KenyaLocations/Resources || { echo "::error::Swift Resources are out of date. Run: cp data/*.json packages/swift/Sources/KenyaLocations/Resources/"; exit 1; }

      - name: Build (root Package.swift)
        run: swift build -c release

      - name: Test (packages/swift Package.swift)
        run: swift test
        working-directory: packages/swift

      - name: Summary
        run: |
          echo "## KenyaLocations ${{ steps.version.outputs.version }} is tagged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Swift Package Manager — add via Xcode or \`Package.swift\`:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`swift" >> $GITHUB_STEP_SUMMARY
          echo ".package(url: \"https://github.com/DavidAmunga/kenya-locations\", from: \"${{ steps.version.outputs.version }}\")" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Swift Package Index](https://swiftpackageindex.com/DavidAmunga/kenya-locations)" >> $GITHUB_STEP_SUMMARY
