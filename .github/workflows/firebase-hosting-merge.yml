# Deploy the interactive demo to https://kenya-locations.web.app on merge to main.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/js/**"
      - "data/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/firebase-hosting-merge.yml"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kenya-locations build
      - run: pnpm --filter kenya-locations-web build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KENYA_LOCATIONS }}
          channelId: live
          projectId: kenya-locations
          entryPoint: apps/web
