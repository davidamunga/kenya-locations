# Deploy the interactive demo to https://kenya-locations.web.app on merge to main.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/js/**"
      - "data/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/firebase-hosting-merge.yml"

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kenya-locations build
      - run: pnpm --filter kenya-locations-web build
        env:
          # The Apps Script endpoint behind "Submit an area" (scripts/submissions/apps-script).
          # Unset, the form opens a prefilled GitHub issue instead.
          VITE_SUBMISSIONS_URL: ${{ vars.VITE_SUBMISSIONS_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KENYA_LOCATIONS }}
          channelId: live
          projectId: kenya-locations
          entryPoint: apps/web
