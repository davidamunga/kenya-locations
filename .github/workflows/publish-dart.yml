name: Publish Dart to pub.dev

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: Build & Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dart

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Validate shared data
        run: node scripts/validate-data.js
        working-directory: ${{ github.workspace }}

      - name: Generate data.dart from shared JSON
        run: dart run packages/dart/scripts/generate_data.dart
        working-directory: ${{ github.workspace }}

      - name: Fail if generated data.dart is stale
        run: git diff --exit-code -- packages/dart/lib/src/generated/data.dart
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force

      - name: Summary
        run: |
          echo "## Published kenya_locations:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "dependencies:" >> $GITHUB_STEP_SUMMARY
          echo "  kenya_locations: ^${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [pub.dev](https://pub.dev/packages/kenya_locations/versions/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY