name: Publish PHP to Packagist

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: Validate and split PHP package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/php

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version from composer.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./composer.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, json
          coverage: none

      - name: Validate shared data
        run: node scripts/validate-data.js
        working-directory: ${{ github.workspace }}

      - name: Copy shared JSON into the package
        run: php scripts/copy-data.php

      - name: Fail if copied data is stale
        run: git diff --exit-code -- packages/php/data
        working-directory: ${{ github.workspace }}

      - name: Validate composer.json
        run: composer validate --strict --no-check-version

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: composer test

      - name: Split packages/php to kenya-locations-php
        working-directory: ${{ github.workspace }}
        env:
          PHP_SPLIT_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PHP_SPLIT_TOKEN:-}" ]; then
            echo "PHP_SPLIT_TOKEN is not set; skipping split push."
            echo "Add a PAT with contents:write on davidamunga/kenya-locations-php as the PHP_SPLIT_TOKEN secret."
            exit 0
          fi
          git subtree split --prefix=packages/php -b php-dist
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote add php-dist "https://x-access-token:${PHP_SPLIT_TOKEN}@github.com/davidamunga/kenya-locations-php.git"
          git push php-dist php-dist:main
          if git ls-remote --tags php-dist "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists on kenya-locations-php"
          else
            git push php-dist "php-dist:refs/tags/v${VERSION}"
            echo "Pushed tag v${VERSION}"
          fi

      - name: Summary
        run: |
          {
            echo "## kenya-locations PHP ${{ steps.version.outputs.version }}"
            echo ""
            echo "Validated \`packages/php\` and (when \`PHP_SPLIT_TOKEN\` is set) pushed"
            echo "the subtree to [kenya-locations-php](https://github.com/davidamunga/kenya-locations-php)."
            echo ""
            echo "First Packagist submit: [packagist.org/packages/submit](https://packagist.org/packages/submit)"
            echo "with \`https://github.com/davidamunga/kenya-locations-php\`."
            echo ""
            echo "\`\`\`bash"
            echo "composer require davidamunga/kenya-locations"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
