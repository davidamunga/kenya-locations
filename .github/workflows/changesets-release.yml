name: Changesets - Version PR

on:
  push:
    branches:
      - main
    # Rebuild the Version PR when changesets or the tooling that renders
    # them change, so fixes to release scripts reach the open Version PR.
    paths:
      - ".changeset/**"
      - "!.changeset/README.md"
      - "scripts/release/**"
      - "package.json"
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manually triggering (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Create Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or Update Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
