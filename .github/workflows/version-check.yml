name: Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "packages/js/lib/**"
      - "packages/react/src/**"
      - "packages/kotlin/src/main/kotlin/**"
      - "packages/swift/Sources/**"
      - "packages/dart/lib/**"
      - ".changeset/**"
      - "scripts/check-changeset.js"
      - ".github/workflows/version-check.yml"

jobs:
  check-changeset:
    name: Require changeset for product changes
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit test changeset checker
        run: node --test scripts/check-changeset.test.js

      - name: Check changeset
        run: node scripts/check-changeset.js --base ${{ github.event.pull_request.base.sha }}
