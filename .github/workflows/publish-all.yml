# Ships the lockstep core trio (JS, Kotlin, Swift) at vX.Y.Z.
# The Release workflow dispatches this on the v* tag after approval; it can
# also be run by hand. React, Dart and PHP have their own workflows.
name: Publish Core Packages

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish-js:
    name: JS → npm
    uses: ./.github/workflows/publish-js.yml
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  publish-kotlin:
    name: Kotlin → Maven Central
    uses: ./.github/workflows/publish-kotlin.yml
    secrets: inherit
    permissions:
      contents: write

  publish-swift:
    name: Swift → verify tag
    uses: ./.github/workflows/publish-swift.yml
    secrets: inherit
    permissions:
      contents: read

  github-release:
    name: Publish GitHub draft release
    needs: [publish-js, publish-kotlin, publish-swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the v* release once JS, Kotlin and Swift succeeded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./packages/js/package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false
            echo "Published the $TAG GitHub release"
          else
            echo "No GitHub release for $TAG (not created by the Release workflow); nothing to publish."
          fi
