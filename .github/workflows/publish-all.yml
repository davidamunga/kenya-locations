# Ships the lockstep core trio (JS, Kotlin, Swift) at vX.Y.Z.
# React and Dart version independently — use their own workflows.
name: Publish Core Packages

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish-js:
    name: JS → npm
    uses: ./.github/workflows/publish-js.yml
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  publish-kotlin:
    name: Kotlin → Maven Central
    uses: ./.github/workflows/publish-kotlin.yml
    secrets: inherit
    permissions:
      contents: write

  publish-swift:
    name: Swift → verify tag
    uses: ./.github/workflows/publish-swift.yml
    secrets: inherit
    permissions:
      contents: read
