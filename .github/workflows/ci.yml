name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate current commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ── Detect which packages changed ─────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      js: ${{ steps.filter.outputs.js }}
      react: ${{ steps.filter.outputs.react }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.filter.outputs.swift }}
      dart: ${{ steps.filter.outputs.dart }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - 'data/**'
            js:
              - 'packages/js/**'
              - 'data/**'
            react:
              - 'packages/react/**'
              - 'packages/js/**'
            kotlin:
              - 'packages/kotlin/**'
              - 'data/**'
            swift:
              - 'packages/swift/**'
              - 'data/**'
            dart:
              - 'packages/dart/**'
              - 'examples/flutter/**'
              - 'data/**'
            web:
              - 'apps/web/**'
              - 'packages/js/**'
              - 'data/**'

  # ── Validate shared data ───────────────────────────────────────────────────
  validate-data:
    name: Validate shared JSON data
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-data.js

  # ── JS package ────────────────────────────────────────────────────────────
  ci-js:
    name: JS — Lint, Build & Test
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: js-dist
          path: packages/js/dist/
          retention-days: 7

  # ── React package ─────────────────────────────────────────────────────────
  ci-react:
    name: React — Lint, Build & Test
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build kenya-locations (required for type resolution)
        run: pnpm build
        working-directory: packages/js
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # ── Kotlin package ────────────────────────────────────────────────────────
  ci-kotlin:
    name: Kotlin — Build & Test
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Copy data files
        run: ./gradlew copyLocationData
      - name: Build
        run: ./gradlew build
      - name: Test
        run: ./gradlew test

  # ── Dart package ──────────────────────────────────────────────────────────
  ci-dart:
    name: Dart — Analyze, Format & Test
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Generate data.dart from shared JSON
        run: dart run packages/dart/scripts/generate_data.dart
        working-directory: ${{ github.workspace }}
      - name: Fail if generated data.dart is stale
        run: git diff --exit-code -- packages/dart/lib/src/generated/data.dart
        working-directory: ${{ github.workspace }}
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run tests
        run: dart test
      - name: Publish dry run
        run: dart pub publish --dry-run

  # ── Web demo ──────────────────────────────────────────────────────────────
  ci-web:
    name: Web — Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kenya-locations build
      - run: pnpm --filter kenya-locations-web build

  # ── Swift package ─────────────────────────────────────────────────────────
  ci-swift:
    name: Swift — Build & Test
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy data files into Resources
        run: mkdir -p packages/swift/Sources/KenyaLocations/Resources && cp data/*.json packages/swift/Sources/KenyaLocations/Resources/
      - name: Build (root Package.swift — validates SPM install URL)
        run: swift build -c release
      - name: Test (packages/swift Package.swift)
        run: swift test
        working-directory: packages/swift