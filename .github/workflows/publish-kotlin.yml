name: Publish Kotlin to Maven Central

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: Build & Publish to Maven Central
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/kotlin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep "^VERSION_NAME=" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Validate shared data
        run: node scripts/validate-data.js
        working-directory: ${{ github.workspace }}

      - name: Copy data files into resources
        run: ./gradlew copyLocationData

      - name: Build JAR
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}

      - name: Summary
        run: |
          echo "## Published io.github.davidamunga:kenya-locations:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`kotlin" >> $GITHUB_STEP_SUMMARY
          echo "implementation(\"io.github.davidamunga:kenya-locations:${{ steps.version.outputs.version }}\")" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Maven Central](https://central.sonatype.com/artifact/io.github.davidamunga/kenya-locations/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
