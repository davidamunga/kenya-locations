name: kenya_locations_example
description: Flutter example for kenya-locations. Loads the data from the dart package.
publish_to: "none"
version: 0.9.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  kenya_locations:
    path: ../../packages/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
